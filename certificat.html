<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Certificat officiel — La nuit de la Petite Souris</title>
<style>
  body{background:#2b3470}
  .page{max-width:820px;margin:0 auto;padding:16px}
  .outils{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 14px}
  .note{color:var(--muet);font-size:.95rem;text-align:center;margin:10px 0 0}
  @media print{.outils,.note{display:none!important}.page{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="page">
  <div class="outils">
    <button class="btn btn-or" id="btn-print">Imprimer (A4)</button>
    <a class="btn btn-petit" href="index.html#5">Retour à l'histoire</a>
  </div>
  <div id="diplome"></div>
  <p class="note">Impression : A4 portrait, couleurs activées (« imprimer les arrière-plans » dans les options du navigateur), marges par défaut.</p>
</div>
<script>
// Pas de zoom en écartant deux doigts (iPhone et iPad ignorent user-scalable=no)
(function(){ var no=function(e){ e.preventDefault(); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n, no, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
  document.addEventListener('wheel', function(e){ if (e.ctrlKey) e.preventDefault(); }, { passive:false });
})();
</script>
<script type="module" src="/src/pages/certificat.ts"></script>
</body>
</html>

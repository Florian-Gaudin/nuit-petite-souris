<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141A3A">
<title>La nuit de la Petite Souris</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='18' cy='18' r='12' fill='%23A79E95'/%3E%3Ccircle cx='46' cy='18' r='12' fill='%23A79E95'/%3E%3Ccircle cx='18' cy='18' r='7' fill='%23F2A3B5'/%3E%3Ccircle cx='46' cy='18' r='7' fill='%23F2A3B5'/%3E%3Ccircle cx='32' cy='36' r='22' fill='%23A79E95'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%232B2B33'/%3E%3Ccircle cx='40' cy='34' r='3' fill='%232B2B33'/%3E%3Ccircle cx='32' cy='43' r='3.5' fill='%23E98BA0'/%3E%3Cpath d='M14 52q18 10 36 0v6q-18 10-36 0z' fill='%23D64045'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Petite Souris">
<style>
/* Écran de lancement : le logo sur le fond de sa couleur, le temps que l'histoire se charge (1,2 s au moins) */
#lancement{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#141A3A,#2b3470);color:#FFF4D6;font:800 clamp(1.3rem,5.5vw,2rem)/1.2 'Trebuchet MS',sans-serif;text-align:center;transition:opacity .45s ease}
#lancement svg{width:min(62vw,320px);height:auto}
#lancement p{margin:0;padding:0 16px}
#lancement.parti{opacity:0;pointer-events:none}
.deja-lance #lancement{display:none}
@media (prefers-reduced-motion:no-preference){
  #lancement .lueur{animation:lance-lueur 1.4s ease-in-out infinite alternate}
  #lancement .scint circle{animation:lance-scint 2.2s ease-in-out infinite}
  #lancement .scint circle:nth-child(2n){animation-delay:.7s}
  #lancement .scint circle:nth-child(3n){animation-delay:1.4s}
}
@keyframes lance-lueur{from{opacity:.45}to{opacity:1}}
@keyframes lance-scint{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<script>
// L'écran de lancement ne s'affiche qu'une fois par visite (pas en passant d'une histoire à l'autre)
try { if (sessionStorage.getItem('souris.lance')) document.documentElement.classList.add('deja-lance'); else sessionStorage.setItem('souris.lance', '1'); } catch (e) { }
</script>
</head>
<body>
<div id="lancement" aria-hidden="true">
  <svg viewBox="0 0 512 512">
    <defs><radialGradient id="lance-g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFC857" stop-opacity=".7"/><stop offset="1" stop-color="#FFC857" stop-opacity="0"/></radialGradient></defs>
    <g class="scint" fill="#fff"><circle cx="70" cy="80" r="3"/><circle cx="430" cy="60" r="2.5"/><circle cx="460" cy="170" r="2"/><circle cx="50" cy="210" r="2"/><circle cx="400" cy="120" r="1.8"/><circle cx="120" cy="130" r="1.6"/></g>
    <path d="M410 70a46 46 0 1 0 0 92a36 36 0 1 1 0-92z" fill="#FFF4D6"/>
    <g transform="translate(256 290)">
      <circle cx="-74" cy="-120" r="52" fill="#A79E95"/><circle cx="-74" cy="-120" r="31" fill="#F2A3B5"/>
      <circle cx="74" cy="-120" r="52" fill="#A79E95"/><circle cx="74" cy="-120" r="31" fill="#F2A3B5"/>
      <circle cx="0" cy="-30" r="112" fill="#A79E95"/>
      <ellipse cx="0" cy="18" rx="46" ry="30" fill="#EFE8DD"/>
      <ellipse cx="0" cy="4" rx="15" ry="11" fill="#E98BA0"/>
      <path d="M-17 30q17 15 34 0" fill="none" stroke="#2B2B33" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-38" cy="-40" r="14" fill="#2B2B33"/><circle cx="38" cy="-40" r="14" fill="#2B2B33"/>
      <circle cx="-33" cy="-45" r="5" fill="#fff"/><circle cx="43" cy="-45" r="5" fill="#fff"/>
      <g stroke="#6B6560" stroke-width="3.5" stroke-linecap="round"><path d="M-46 10l-70-14M-46 20l-70 4M46 10l70-14M46 20l70 4"/></g>
      <path d="M-100 64q100 50 200 0v34q-100 50-200 0z" fill="#D64045"/>
    </g>
    <circle class="lueur" cx="420" cy="420" r="70" fill="url(#lance-g)"/>
    <path d="M400 380q20-30 40 0" fill="none" stroke="#6E4630" stroke-width="7"/>
    <rect x="392" y="384" width="56" height="62" rx="14" fill="#FFC857" stroke="#B9801A" stroke-width="5"/>
    <ellipse cx="420" cy="415" rx="12" ry="17" fill="#FFF4D6"/>
  </svg>
  <p>La nuit de la Petite Souris</p>
</div>
<header class="fil" id="fil"></header>
<main id="scene" class="scene"></main>
<footer id="bandeau" class="bandeau" aria-label="Quenotte raconte"></footer>
<div id="voile-noir" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<script>
// Pas de zoom en écartant deux doigts (iPhone et iPad ignorent user-scalable=no)
(function(){ var no=function(e){ e.preventDefault(); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n, no, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
  document.addEventListener('wheel', function(e){ if (e.ctrlKey) e.preventDefault(); }, { passive:false });
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
